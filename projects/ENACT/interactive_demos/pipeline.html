<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ENACT — How one photo becomes a motion</title>
  <meta name="description"
    content="Stage-by-stage walkthrough of the ENACT pipeline: one photo and one sentence turned into 3D human-scene interaction motion.">
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Ccircle cx='16' cy='9' r='4' fill='%236ea8fe'/%3E%3Cpath d='M9 30c0-6 3-11 7-11s7 5 7 11' fill='%236ea8fe'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>if(/[?&]embed/.test(location.search))document.documentElement.classList.add('is-embed')</script>
  <style>
    :root {
      --bg: #ffffff;
      --ink: #1f2430;
      --ink-soft: #5b6372;
      --line: #e3e7ee;
      --stage: #0d1117;
      --accent: #363636;
      --panel: #fbfcfd;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Noto Sans', 'Google Sans', system-ui, -apple-system, sans-serif;
      font-size: 15px;
      overflow: hidden;
    }

    /* ── header ───────────────────────────────────────────────────────── */

    header {
      flex: 0 0 auto;
      padding: 12px 16px 10px;
      border-bottom: 1px solid var(--line);
    }

    .head-line {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 12px;
    }

    #doc-title {
      margin: 0;
      font-family: 'Google Sans', 'Noto Sans', sans-serif;
      font-size: 17px;
      font-weight: 600;
    }

    #prompt {
      margin: 0;
      flex: 1 1 320px;
      min-width: 0;
      color: var(--ink-soft);
      font-size: 14px;
      line-height: 1.45;
    }

    #prompt::before { content: '“'; }
    #prompt::after  { content: '”'; }

    #rail {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .step {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font: inherit;
      font-size: 13.5px;
      padding: 6px 13px 6px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #f7f8fa;
      color: var(--ink-soft);
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }

    .step:hover { border-color: #c9d0dc; color: var(--ink); }

    .step-n {
      display: grid;
      place-content: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #dfe4ec;
      color: #4a5262;
      font-size: 11.5px;
      font-weight: 700;
    }

    .step.is-done .step-n { background: #c9f0de; color: #10694a; }

    .step.is-active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .step.is-active .step-n { background: #ffd919; color: #4a3b00; }

    /* ── body: viewport + panel ───────────────────────────────────────── */

    main {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
    }

    #viewport {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      background: var(--stage);
    }

    #stage {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    #stage:active { cursor: grabbing; }

    #photo-stage {
      position: absolute;
      inset: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 20px;
      overflow: hidden;
      background: var(--stage);
    }

    /* The caption and the gaps have to come out of the image's share, or a
       100%-tall image pushes the figure past the viewport. */
    #photo-stage img {
      min-height: 0;
      max-width: 100%;
      max-height: calc(100% - 34px);
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
    }

    #photo-stage figcaption {
      flex: 0 0 auto;
      display: grid;
      gap: 6px;
      max-width: 760px;
      text-align: center;
    }

    .cap-label {
      color: #9aa6b8;
      font-size: 11.5px;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .cap-prompt {
      color: #e7edf6;
      font-size: 14px;
      line-height: 1.45;
    }

    .cap-prompt::before { content: '“'; }
    .cap-prompt::after  { content: '”'; }

    #hint {
      position: absolute;
      right: 12px;
      bottom: 10px;
      color: rgba(226, 232, 240, .55);
      font-size: 11.5px;
      pointer-events: none;
    }

    #status {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      padding: 24px;
      text-align: center;
      color: #e2e8f0;
      font-size: 14px;
      background: rgba(13, 17, 23, .82);
    }

    #status[data-kind="error"] { color: #ffb4a8; }

    .is-hidden { display: none !important; }

    aside {
      flex: 0 0 360px;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--line);
      background: var(--panel);
      overflow-y: auto;
      padding: 16px;
    }

    #stage-number {
      color: var(--ink-soft);
      font-size: 11.5px;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    #stage-title {
      margin: 4px 0 2px;
      font-family: 'Google Sans', 'Noto Sans', sans-serif;
      font-size: 20px;
      font-weight: 600;
    }

    #stage-subtitle {
      color: #8a6f00;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: .02em;
    }

    #stage-body > p {
      margin: 10px 0 0;
      color: #434a58;
      font-size: 14px;
      line-height: 1.6;
    }

    #keyframes {
      display: grid;
      gap: 6px;
      margin-top: 14px;
    }

    .kf {
      display: grid;
      grid-template-columns: auto auto 1fr;
      align-items: baseline;
      gap: 4px 8px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      font-size: 13px;
    }

    .kf-verb {
      color: #8a6f00;
      font-weight: 600;
    }

    .kf-obj { color: var(--ink); }

    .kf-meta {
      grid-column: 1 / -1;
      color: var(--ink-soft);
      font-size: 11.5px;
    }

    #legend {
      display: grid;
      gap: 5px;
      margin-top: 14px;
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--ink-soft);
      font-size: 12.5px;
    }

    .sw {
      flex: 0 0 auto;
      width: 22px;
      height: 10px;
      border-radius: 3px;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12);
    }

    #gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .shot {
      margin: 0;
      cursor: zoom-in;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }

    .shot img {
      display: block;
      width: 100%;
      height: 92px;
      object-fit: cover;
    }

    .shot figcaption {
      padding: 5px 7px 6px;
      color: var(--ink-soft);
      font-size: 11px;
      line-height: 1.3;
    }

    #lightbox {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-content: center;
      gap: 10px;
      padding: 30px;
      margin: 0;
      background: rgba(10, 13, 18, .92);
      cursor: zoom-out;
    }

    #lightbox img {
      max-width: 90vw;
      max-height: 82vh;
      border-radius: 8px;
    }

    #lightbox figcaption {
      color: #d7dee9;
      font-size: 13px;
      text-align: center;
    }

    /* ── footer ───────────────────────────────────────────────────────── */

    footer {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
      padding: 10px 16px 12px;
      border-top: 1px solid var(--line);
      background: var(--panel);
    }

    button {
      font: inherit;
      font-size: 13.5px;
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
    }

    button:hover:not(:disabled) { border-color: #c9d0dc; }

    button:disabled { opacity: .45; cursor: default; }

    #transport {
      display: flex;
      flex: 1 1 320px;
      align-items: center;
      gap: 12px;
      min-width: 220px;
    }

    .track { flex: 1 1 200px; }

    #phases {
      position: relative;
      height: 14px;
      margin-bottom: 2px;
      border-radius: 4px;
      background: #eef1f5;
      overflow: hidden;
    }

    .phase {
      position: absolute;
      top: 0;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 9.5px;
      letter-spacing: .05em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    input[type="range"] {
      display: block;
      width: 100%;
      margin: 0;
      accent-color: #4c8dff;
    }

    #point-size { width: 80px; }

    .readout {
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      color: var(--ink-soft);
      min-width: 86px;
    }

    .knob {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ink-soft);
      font-size: 12px;
    }

    .spacer { flex: 1 1 auto; }

    /* Narrow screens cannot hold the header, a 3D viewport, the panel and the
       controls at once, so the page scrolls instead of being a fixed shell and
       the viewport takes a fixed share of the screen. */
    @media (max-width: 900px) {
      html, body { height: auto; }
      body { min-height: 100%; overflow: auto; }
      main { flex-direction: column; }
      #viewport { flex: 0 0 auto; height: 58vh; min-height: 320px; }
      aside {
        flex: 0 0 auto;
        max-height: none;
        overflow: visible;
        border-left: 0;
        border-top: 1px solid var(--line);
      }
      #gallery { grid-template-columns: repeat(3, 1fr); }
      #hint { display: none; }
      footer {
        position: sticky;
        bottom: 0;
        z-index: 5;
        box-shadow: 0 -6px 18px rgba(16, 20, 28, .07);
      }
    }

    /* ── modern dark theme (overrides) ───────────────────────────────── */
    :root {
      --bg: #0b0f16; --ink: #e8ecf3; --ink-soft: #94a0b4; --line: rgba(255,255,255,.08);
      --stage: #0b0f16; --accent: #e8ecf3; --panel: #121823; --panel-2: #1a2230;
    }
    body { font-family: 'Inter', 'Noto Sans', system-ui, sans-serif; font-size: 14px; color-scheme: dark; }
    header { background: var(--panel); }
    #doc-title, #stage-title { font-family: inherit; }
    #doc-title { font-size: 15px; }
    #prompt::before { content: '\201C'; } #prompt::after { content: '\201D'; }
    .step { background: transparent; font-size: 13px; font-weight: 500; }
    .step:hover { border-color: rgba(255,255,255,.2); }
    .step-n { background: var(--panel-2); color: var(--ink-soft); }
    .step.is-done .step-n { background: rgba(60,200,140,.18); color: #6fe0b0; }
    .step.is-active { background: var(--ink); border-color: var(--ink); color: #0b0f16; }
    .step.is-active .step-n { background: #0b0f16; color: #ffd919; }
    #stage-subtitle, .kf-verb { color: #ffd919; }
    #stage-body > p { color: #b4becf; }
    .kf, #legend, .shot { background: var(--panel-2); }
    .kf-obj { color: var(--ink); }
    .sw { box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
    #hint { background: rgba(18,24,35,.6); padding: 4px 10px; border-radius: 999px; }
    button { border-radius: 999px; background: transparent; color: var(--ink); font-weight: 600; font-size: 13px; transition: transform .1s, background .15s; }
    button:hover:not(:disabled) { background: var(--panel-2); border-color: rgba(255,255,255,.2); }
    button:active:not(:disabled) { transform: scale(.96); }
    #next, #play { background: var(--ink); color: #0b0f16; border-color: var(--ink); }
    #next:hover:not(:disabled), #play:hover { background: #fff; }
    button:focus-visible, .step:focus-visible, input:focus-visible { outline: 2px solid #6ea8fe; outline-offset: 2px; }
    #phases { height: 6px; background: var(--panel-2); border-radius: 999px; margin-bottom: 6px; }
    .phase { font-size: 0; }
    input[type="range"] { -webkit-appearance: none; appearance: none; height: 18px; background: transparent; cursor: pointer; }
    input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 999px; background: var(--panel-2); }
    input[type="range"]::-moz-range-track { height: 4px; border-radius: 999px; background: var(--panel-2); }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 1px 6px rgba(0,0,0,.5); }
    input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 0; }
    .is-embed header .head-line { display: none; }
    .is-embed header { padding-top: 10px; }
    @media (max-width: 900px) { footer { box-shadow: 0 -6px 18px rgba(0,0,0,.4); } }

  </style>
</head>

<body>
  <header>
    <div class="head-line">
      <h1 id="doc-title">Pipeline walkthrough</h1>
      <p id="prompt"></p>
    </div>
    <nav id="rail" aria-label="Pipeline stages"></nav>
  </header>

  <main>
    <div id="viewport">
      <canvas id="stage"></canvas>

      <figure id="photo-stage" class="is-hidden">
        <img alt="The single input photograph">
        <figcaption>
          <span class="cap-label">the entire input: this photo and this text prompt</span>
          <span class="cap-prompt" id="photo-prompt"></span>
        </figcaption>
      </figure>

      <div id="hint">drag to orbit · scroll to zoom · ← → to step through stages</div>
      <div id="status" class="is-hidden"></div>
    </div>

    <aside>
      <span id="stage-number"></span>
      <h2 id="stage-title"></h2>
      <span id="stage-subtitle"></span>
      <div id="stage-body"></div>
      <div id="keyframes"></div>
      <div id="legend" class="is-hidden"></div>
      <div id="gallery" class="is-hidden"></div>
    </aside>
  </main>

  <footer>
    <button id="prev" type="button">← Back</button>
    <button id="next" type="button">Next →</button>

    <div id="transport" class="is-hidden">
      <button id="play" type="button">❙❙&nbsp; Pause</button>
      <div class="track">
        <div id="phases"></div>
        <input id="timeline" type="range" min="0" max="1" step="1" value="0"
          aria-label="Motion frame">
      </div>
      <span class="readout" id="frame-label">– / –</span>
    </div>

    <span class="spacer"></span>
    <span class="knob" title="Size of the scene points">
      points
      <input id="point-size" type="range" min="0.4" max="2.5" step="0.05" value="1"
        aria-label="Point size">
    </span>
    <button id="reset-view" type="button">Reset view</button>
  </footer>

  <figure id="lightbox" class="is-hidden">
    <img alt="">
    <figcaption></figcaption>
  </figure>

  <script type="module" src="./js/pipeline.js"></script>
</body>

</html>
